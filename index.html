<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="家計簿">
<meta name="theme-color" content="#6E4BF5">
<title>家計簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F5FA;--card:#FFF;--line:#E4E2EE;--line2:#EFEDF5;--text:#16141F;--muted:#5E5A6E;--accent:#6E4BF5;--accent2:#B7A6FF;--hero:#16141F;--heroMuted:#C9C5D8;--heroTrack:#2C2A36;--inc:#1D5FD6;--seg:#E9E6F2;--segOn:#FFF;--overlay:rgba(22,20,31,.45)}
[data-theme=dark]{--bg:#121117;--card:#1B1A22;--line:#2C2A36;--line2:#26242F;--text:#ECEAF3;--muted:#A29FB2;--accent:#7C5CFF;--accent2:#B7A6FF;--hero:#241D3D;--heroMuted:#BDB4DA;--heroTrack:#3A3156;--inc:#7FAEFF;--seg:#24222C;--segOn:#34313F;--overlay:rgba(0,0,0,.6)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.num{font-family:'JetBrains Mono',monospace;font-weight:700}
.muted{color:var(--muted);font-size:12px}
.wrap{max-width:480px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(16px + env(safe-area-inset-top)) 0 10px}
.logo{display:flex;align-items:center;gap:10px}
.pill{background:var(--accent);color:#fff;font-weight:700;font-size:14px;padding:6px 14px;border-radius:999px;letter-spacing:.04em}
.seg{display:flex;gap:2px;background:var(--seg);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font-size:11px;padding:6px 12px;border-radius:999px;min-height:30px}
.seg button.on{background:var(--accent);color:#fff}
.mnav{display:flex;align-items:center;justify-content:space-between;padding:4px 0 14px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center}
.iconbtn svg{stroke:var(--text)}
#month{font-size:26px;color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero{grid-column:1/3;background:var(--hero);color:#fff;border-radius:16px;padding:16px 18px}
.hero .lbl{font-size:12px;color:var(--heroMuted)}
#bal{font-size:32px;margin-top:4px}
.track{height:6px;background:var(--heroTrack);border-radius:3px;margin-top:12px;overflow:hidden}
#ratioBar{height:100%;width:0;background:var(--accent2);transition:width .4s}
#ratioTxt{font-size:11px;color:var(--heroMuted);margin-top:6px}
.stat .num{font-size:20px;margin-top:2px}
.sec{margin-top:10px}
.sechead{display:flex;justify-content:space-between;align-items:baseline}
.sechead b{font-size:13px}
#catBar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin-top:10px;gap:2px}
#catLegend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:10px;font-size:11px}
.lg{display:flex;align-items:center;gap:6px}
.lg span{width:8px;height:8px;border-radius:2px;flex-shrink:0}
#list{padding:2px 14px}
.row{display:flex;align-items:center;gap:10px;width:100%;padding:11px 0;border:0;border-bottom:1px solid var(--line2);background:transparent;text-align:left}
.row:last-child{border-bottom:0}
.row .d{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);width:38px;flex-shrink:0}
.row .t{flex:1;min-width:0}
.row .t div:first-child{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t div:last-child{font-size:11px;color:var(--muted)}
.row .a{font-size:14px}
.inc{color:var(--inc)}
.empty{text-align:center;color:var(--muted);font-size:12px;padding:28px 0;line-height:1.8}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:20px;border:0;background:var(--accent);box-shadow:0 8px 24px rgba(110,75,245,.35);display:flex;align-items:center;justify-content:center}
/* sheet */
.overlay{position:fixed;inset:0;background:var(--overlay);display:none;align-items:flex-end;justify-content:center;z-index:10}
.overlay.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.tabs{display:flex;gap:4px;background:var(--seg);border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font-size:13px;border-radius:9px;min-height:38px}
.tabs button.on{background:var(--segOn);color:var(--text);font-weight:700}
.field{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2);font-size:12px;color:var(--muted);gap:10px}
.field:last-child{border-bottom:0}
.field input{border:0;background:transparent;text-align:right;font-size:15px;color:var(--text);flex:1;min-width:0;outline:none}
#fAmount{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700}
.lbl2{font-size:12px;color:var(--muted);margin:12px 0 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12px}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.actions{display:flex;gap:8px;margin-top:16px}
.btn{min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:14px;flex:1}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;flex:2}
.btn.danger{color:#D23B3B}
.btn:disabled{opacity:.5}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#login .card{width:100%;max-width:360px;padding:28px 22px;text-align:center}
#login input{width:100%;min-height:50px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);padding:0 14px;margin:18px 0 10px;font-size:16px;outline:none}
#login input:focus{border-color:var(--accent)}
#loginErr{color:#D23B3B;font-size:12px;min-height:18px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
</style>
</head>
<body>

<!-- ログイン -->
<section id="login" hidden>
  <div class="card">
    <span class="pill">KAKEIBO</span>
    <div style="margin-top:14px;font-weight:700">家計簿</div>
    <div class="muted" style="margin-top:4px">パスワードを入力してください</div>
    <input id="pw" type="password" placeholder="パスワード" autocomplete="current-password">
    <div id="loginErr"></div>
    <button id="loginBtn" class="btn primary" style="width:100%">開く</button>
  </div>
</section>

<!-- メイン -->
<div id="app" hidden>
  <div class="wrap">
    <header>
      <div class="logo"><span class="pill">KAKEIBO</span><span class="muted">家計簿</span></div>
      <div class="seg" id="themeSeg">
        <button data-t="light">ライト</button><button data-t="dark">ダーク</button>
      </div>
    </header>

    <div class="mnav">
      <button class="iconbtn" id="prev" aria-label="前の月"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <div id="month" class="num">----/--</div>
      <button class="iconbtn" id="next" aria-label="次の月"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>

    <div class="grid2">
      <div class="hero">
        <div class="lbl">今月の収支</div>
        <div id="bal" class="num">¥0</div>
        <div class="track"><div id="ratioBar"></div></div>
        <div id="ratioTxt"></div>
      </div>
      <div class="card stat"><div class="muted">収入</div><div id="inc" class="num inc">¥0</div></div>
      <div class="card stat"><div class="muted">支出（自分の負担分）</div><div id="exp" class="num">¥0</div></div>
    </div>

    <div class="card sec">
      <div class="sechead"><b>カテゴリ別</b><span class="muted" id="catTotal"></span></div>
      <div id="catBar"></div>
      <div id="catLegend"></div>
    </div>

    <div class="card sec" id="list"></div>

    <div style="text-align:center;margin-top:18px"><button id="logout" class="muted" style="border:0;background:none;text-decoration:underline">ログアウト</button></div>
  </div>

  <button class="fab" id="addBtn" aria-label="記録を追加"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
</div>

<!-- 入力シート -->
<div class="overlay" id="sheetOv">
  <div class="sheet">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <b id="sheetTitle" style="font-size:17px">記録を追加</b>
      <button class="iconbtn" id="closeSheet" aria-label="閉じる" style="width:40px;height:40px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="tabs" id="typeTabs"><button data-v="expense">支出</button><button data-v="income">収入</button></div>
    <div class="card" style="margin-top:12px;padding:2px 14px">
      <label class="field">日付<input id="fDate" type="date"></label>
      <label class="field">金額<input id="fAmount" inputmode="numeric" placeholder="0"></label>
      <label class="field"><span id="storeLbl">店名・内容</span><input id="fStore" placeholder="例：セブン-イレブン"></label>
      <label class="field">メモ<input id="fMemo" placeholder="任意"></label>
    </div>
    <div class="lbl2">支払方法</div>
    <div class="chips" id="methodChips"></div>
    <div class="lbl2">カテゴリ</div>
    <div class="chips" id="catChips"></div>
    <div class="actions">
      <button class="btn danger" id="delBtn" hidden>削除</button>
      <button class="btn primary" id="saveBtn">保存する</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxun63HIuJEJAHTD-oKqFPUeA3V8JOKW_i60QUrsazt00p09N9lTzRxSiqHvYXJLqgDGA/exec';

const EXP_CATS = ['食費','外食','日用品','交通','娯楽','交際費','その他'];
const INC_CATS = ['給与','バイト','臨時収入','その他'];
const METHODS  = ['現金','PayPay','カード','振込','その他'];
const COLORS   = ['#7C5CFF','#B7A6FF','#E07B39','#3BA3A0','#D6619B','#5B8DEF','#9A96A8'];

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const yen = n => '¥' + Math.round(n).toLocaleString('ja-JP');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const shiftMonth = (m, k) => { let [y, mo] = m.split('-').map(Number); mo += k; while (mo < 1) { mo += 12; y--; } while (mo > 12) { mo -= 12; y++; } return `${y}-${pad(mo)}`; };

const state = { month: todayStr().slice(0,7), records: [], editing: null };
const f = { type: 'expense', method: 'PayPay', category: '食費' };

/* ---------- API ---------- */
async function api(action, data = {}) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, pass: localStorage.getItem('kk_pass'), ...data })
  });
  const j = await res.json();
  if (!j.ok) {
    if (String(j.error).includes('パスワード')) logout();
    throw new Error(j.error);
  }
  return j;
}

/* ---------- 表示切替 ---------- */
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2000); }
function setTheme(t) { document.documentElement.dataset.theme = t; localStorage.setItem('kk_theme', t); document.querySelectorAll('#themeSeg button').forEach(b => b.classList.toggle('on', b.dataset.t === t)); }
function showLogin() { $('#app').hidden = true; $('#login').hidden = false; }
function showApp() { $('#login').hidden = true; $('#app').hidden = false; load(); }
function logout() { localStorage.removeItem('kk_pass'); showLogin(); }

/* ---------- データ読み込み ---------- */
async function load() {
  $('#month').textContent = state.month.replace('-', '/');
  $('#list').innerHTML = '<div class="empty">読み込み中…</div>';
  try {
    const j = await api('list', { month: state.month });
    state.records = j.records;
    render();
  } catch (e) {
    $('#list').innerHTML = `<div class="empty">読み込みに失敗しました<br>${esc(e.message)}</div>`;
  }
}

function render() {
  const recs = state.records;
  let inc = 0, exp = 0; const byCat = {};
  recs.forEach(r => {
    if (r.type === 'income') inc += r.amount;
    else { const c = r.category || 'その他'; exp += r.myShare; byCat[c] = (byCat[c] || 0) + r.myShare; }
  });
  const bal = inc - exp;
  $('#bal').textContent = (bal >= 0 ? '+' : '-') + yen(Math.abs(bal));
  $('#inc').textContent = yen(inc);
  $('#exp').textContent = yen(exp);
  const pct = inc > 0 ? Math.round(exp / inc * 100) : 0;
  $('#ratioBar').style.width = Math.min(100, pct) + '%';
  $('#ratioTxt').textContent = inc > 0 ? `収入に対する支出 ${pct}%` : '今月の収入はまだありません';

  const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  $('#catTotal').textContent = '支出 ' + yen(exp);
  $('#catBar').innerHTML = cats.length
    ? cats.map(([c, v], i) => `<div style="flex:${v};background:${COLORS[i % COLORS.length]}"></div>`).join('')
    : '<div style="flex:1;background:var(--line)"></div>';
  $('#catLegend').innerHTML = cats.length
    ? cats.map(([c, v], i) => `<div class="lg"><span style="background:${COLORS[i % COLORS.length]}"></span>${esc(c)} ${yen(v)}</div>`).join('')
    : '<div class="muted">支出の記録はまだありません</div>';

  $('#list').innerHTML = recs.length ? recs.map(r => {
    const isInc = r.type === 'income';
    const name = r.store || r.category || (isInc ? '収入' : '支出');
    const sub = [r.method, r.category, r.memo].filter(Boolean).map(esc).join(' · ');
    const amt = isInc ? r.amount : r.myShare;
    return `<button class="row" data-id="${esc(r.id)}">
      <div class="d">${r.date.slice(5).replace('-', '/')}</div>
      <div class="t"><div>${esc(name)}</div><div>${sub}</div></div>
      <div class="a num ${isInc ? 'inc' : ''}">${isInc ? '+' : '-'}${yen(amt)}</div>
    </button>`;
  }).join('') : '<div class="empty">この月の記録はまだありません。<br>下の ＋ から追加できます。</div>';
}

/* ---------- 入力シート ---------- */
function renderChips() {
  document.querySelectorAll('#typeTabs button').forEach(b => b.classList.toggle('on', b.dataset.v === f.type));
  const cats = f.type === 'income' ? INC_CATS : EXP_CATS;
  if (!cats.includes(f.category)) f.category = cats[0];
  $('#catChips').innerHTML = cats.map(c => `<button data-v="${c}" class="${c === f.category ? 'on' : ''}">${c}</button>`).join('');
  $('#methodChips').innerHTML = METHODS.map(m => `<button data-v="${m}" class="${m === f.method ? 'on' : ''}">${m}</button>`).join('');
  $('#storeLbl').textContent = f.type === 'income' ? '内容' : '店名・内容';
  $('#fStore').placeholder = f.type === 'income' ? '例：バイト代' : '例：セブン-イレブン';
}

function openForm(rec) {
  state.editing = rec || null;
  f.type = rec?.type || 'expense';
  f.method = rec?.method || (f.type === 'income' ? '振込' : 'PayPay');
  f.category = rec?.category || (f.type === 'income' ? INC_CATS[0] : EXP_CATS[0]);
  const today = todayStr();
  $('#fDate').value = rec?.date || (today.startsWith(state.month) ? today : state.month + '-01');
  $('#fAmount').value = rec ? rec.amount.toLocaleString('ja-JP') : '';
  $('#fStore').value = rec?.store || '';
  $('#fMemo').value = rec?.memo || '';
  $('#sheetTitle').textContent = rec ? '記録を編集' : '記録を追加';
  $('#delBtn').hidden = !rec;
  renderChips();
  $('#sheetOv').classList.add('open');
  if (!rec) setTimeout(() => $('#fAmount').focus(), 150);
}
function closeForm() { $('#sheetOv').classList.remove('open'); }

async function saveForm() {
  const amount = Number($('#fAmount').value.replace(/[^\d]/g, ''));
  const date = $('#fDate').value;
  if (!date) return toast('日付を入力してください');
  if (!amount) return toast('金額を入力してください');
  const ed = state.editing;
  const record = {
    id: ed?.id, date, type: f.type, amount,
    myShare: ed?.split ? ed.myShare : amount, // 割り勘はStep5で対応
    method: f.method, category: f.category,
    store: $('#fStore').value.trim(), memo: $('#fMemo').value.trim(),
    items: ed?.items || null, split: ed?.split || null
  };
  const btn = $('#saveBtn'); btn.disabled = true; btn.textContent = '保存中…';
  try {
    await api('save', { record });
    closeForm(); toast('保存しました');
    state.month = date.slice(0, 7); load();
  } catch (e) { toast('保存失敗: ' + e.message); }
  finally { btn.disabled = false; btn.textContent = '保存する'; }
}

async function deleteRec() {
  if (!state.editing || !confirm('この記録を削除しますか？')) return;
  try { await api('delete', { id: state.editing.id }); closeForm(); toast('削除しました'); load(); }
  catch (e) { toast('削除失敗: ' + e.message); }
}

/* ---------- イベント ---------- */
$('#prev').onclick = () => { state.month = shiftMonth(state.month, -1); load(); };
$('#next').onclick = () => { state.month = shiftMonth(state.month, 1); load(); };
$('#themeSeg').onclick = e => { const t = e.target.dataset.t; if (t) setTheme(t); };
$('#addBtn').onclick = () => openForm();
$('#closeSheet').onclick = closeForm;
$('#sheetOv').onclick = e => { if (e.target.id === 'sheetOv') closeForm(); };
$('#saveBtn').onclick = saveForm;
$('#delBtn').onclick = deleteRec;
$('#logout').onclick = logout;
$('#list').onclick = e => { const b = e.target.closest('.row'); if (b) openForm(state.records.find(r => r.id === b.dataset.id)); };
$('#typeTabs').onclick = e => { const v = e.target.dataset.v; if (v) { f.type = v; f.method = v === 'income' ? '振込' : 'PayPay'; renderChips(); } };
$('#methodChips').onclick = e => { const v = e.target.dataset.v; if (v) { f.method = v; renderChips(); } };
$('#catChips').onclick = e => { const v = e.target.dataset.v; if (v) { f.category = v; renderChips(); } };
$('#fAmount').oninput = e => { const n = e.target.value.replace(/[^\d]/g, ''); e.target.value = n ? Number(n).toLocaleString('ja-JP') : ''; };

async function doLogin() {
  const pw = $('#pw').value; if (!pw) return;
  $('#loginErr').textContent = ''; $('#loginBtn').disabled = true;
  localStorage.setItem('kk_pass', pw);
  try { await api('ping'); showApp(); }
  catch (e) { localStorage.removeItem('kk_pass'); $('#loginErr').textContent = e.message; }
  finally { $('#loginBtn').disabled = false; }
}
$('#loginBtn').onclick = doLogin;
$('#pw').onkeydown = e => { if (e.key === 'Enter') doLogin(); };

/* ---------- 起動 ---------- */
setTheme(localStorage.getItem('kk_theme') || 'light');
localStorage.getItem('kk_pass') ? showApp() : showLogin();
</script>
</body>
</html>
